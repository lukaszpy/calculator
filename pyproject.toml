[project]
name = "calculator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pre-commit>=4.7.0",
]

[project.scripts]
calculator = "calculator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]

[tool.pylint.main]
ignore-paths = ["tests/.*"]